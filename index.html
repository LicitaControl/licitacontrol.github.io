<style>
/* Layout: sidebar fija a la izquierda, centro con calendario semanal y mensual, columna derecha con indicadores y recordatorios. En móvil la barra lateral pasa a una franja superior. */

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --navy:#0a1226; --navy-fg:#c9d3ee; --accent:#6f9bf0; --accent-soft:#233459;
  --ok:#5fd09a; --warn:#f0b24a; --warn-soft:#3a2d12; --crit:#ff8a80; --crit-soft:#3d1c1a; --ok-soft:#14352a;
  --hol:#c9a0ff; --hol-soft:#2d2046; --weekend:#1b2238; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#161e33; --surface2:#1c2540; --line:#2a3555; --fg:#e7ecfa; --muted:#98a3c4;
  --navy:#0a1226; --navy-fg:#c9d3ee; --accent:#6f9bf0; --accent-soft:#233459;
  --ok:#5fd09a; --warn:#f0b24a; --warn-soft:#3a2d12; --crit:#ff8a80; --crit-soft:#3d1c1a; --ok-soft:#14352a;
  --hol:#c9a0ff; --hol-soft:#2d2046; --weekend:#1b2238; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-block:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

function alerts(){
  var out=[],now=new Date();
  events().forEach(function(e){
    if(e.done)return;
    var d=diff(e.fecha);
    if(e.tipo==='entrega'&&d<0){out.push({e:e,d:d,sev:'crit'});return}
    if(d<0)return;
    var th=alOf(e.it,e.tipo);if(!th.length)return;
    var hm=horaOf(e.it,e.tipo).split(':');
    var maxN=Math.max.apply(null,th);
    var trig=new Date(parse(e.fecha).getFullYear(),parse(e.fecha).getMonth(),parse(e.fecha).getDate()-maxN,+hm[0],+hm[1]);
    if(now>=trig){out.push({e:e,d:d,sev:d<=1?'crit':'warn'})}
  });
  out.sort(function(a,b){return a.d-b.d});
  return out;
}

/* kpis */
/* Cada licitación cuenta en una sola tarjeta. Prioridad: entregada, por vencer, apertura próxima, activa. */
function cat(i){
  if(i.estado==='Entregada')return 'ent';
  var de=diff(i.entrega),da=diff(i.apertura);
  if(de>=0&&de<=3)return 'venc';
  if(da>=0&&da<=7)return 'aper';
  if(de>=0)return 'act';
  return 'vencida';
}
function kpiItems(k){
  var key=k==='aper'?'apertura':'entrega';
  if(k==='prio'){var pids={};JD.prios.forEach(function(x){pids[x.licitacion_id]=1});return items.filter(function(i){return pids[i.id]&&i.estado!=='Entregada'}).sort(function(a,b){return a.entrega<b.entrega?-1:a.entrega>b.entrega?1:0})}
  var r=items.filter(function(i){return cat(i)===k}).sort(function(a,b){return a[key]<b[key]?-1:a[key]>b[key]?1:0});
  if(k==='ent')r.reverse();
  return r;

function searchRes(q){q=q.toLowerCase();return items.filter(function(it){return (it.num+' '+it.inst+' '+it.obj).toLowerCase().indexOf(q)>-1})}
function renderSearch(){
  var box=document.getElementById('sres');
  if(!S.q||S.view==='licitaciones'){box.hidden=true;box.innerHTML='';return}
  var r=searchRes(S.q);box.hidden=false;
  box.innerHTML=r.length?r.slice(0,6).map(function(it){return '<button type="button" class="sr" data-act="hist" data-id="'+it.id+'"><div class="t">'+esc(it.num)+' '+statusPill(it)+'</div><div class="m">'+esc(it.inst)+' — '+esc(it.obj)+'</div></button>'}).join('')+(r.length>6?'<div class="m" style="padding:8px 12px;color:var(--muted)">y '+(r.length-6)+' más. Escribe más para afinar.</div>':''):'<div class="m" style="padding:12px;color:var(--muted)">No hay licitaciones que coincidan.</div>';
}
function render(){
  DP=null;
  document.getElementById('todayLbl').textContent=TODAY.getDate()+'/'+String(TODAY.getMonth()+1).padStart(2,'0')+'/'+TODAY.getFullYear();
  renderNav();
  renderUser();
  var p=document.getElementById('page');
  p.innerHTML=({inicio:vInicio,licitaciones:vLic,historial:vHistorial,sicop:vSicop,equipo:vEquipo})[S.view]();
  renderBell();
  renderModal();
  renderSearch();
  var f=document.getElementById('addf');
  ['a','e'].forEach(function(k){var se=document.getElementById('f_al_'+k);if(se)se.addEventListener('change',function(){var ci=document.getElementById('f_cus_'+k);ci.hidden=se.value!=='c';if(se.value==='c')ci.focus()})});
  if(f)f.addEventListener('submit',function(ev){
    ev.preventDefault();
    var g=function(i){return document.getElementById(i).value.trim()};
    if(!g('f_ap')||!g('f_en')){toast('Elige la fecha de apertura y la de entrega');return}
    if(!g('f_tipo')){toast('Elige el tipo de licitación');return}
    var grp=function(k){
      var v=document.getElementById('f_al_'+k).value;
      if(v==='')return [];
      if(v==='c'){
        var cv=parseInt(document.getElementById('f_cus_'+k).value,10);
        return (cv>=1&&cv<=90)?[cv]:null;
      }
      return [+v];
    };
    var alA=grp('a'),alE=grp('e');
    if(alA===null||alE===null){toast('Escribe los días personalizados, de 1 a 90');return}
    var nueva={num:g('f_num'),inst:g('f_inst'),obj:g('f_obj'),tipo:g('f_tipo'),apertura:g('f_ap'),entrega:g('f_en'),alA:alA,horaA:g('f_hora_a')||'08:00',alE:alE,horaE:g('f_hora_e')||'08:00'};
    var ahora=new Date().toISOString();
    if(S.edit){
      var eid=S.edit,aplicar=function(){
        items.forEach(function(i){if(i.id===eid){Object.assign(i,nueva);i.editada=ahora}});
        S.edit=null;save();render();toast('Cambios guardados');
      };
      if(CLOUD){
        var up=toRow(nueva);up.editada_en=ahora;
        sb.from('licitaciones').update(up).eq('id',eid).then(function(r){
          if(r.error){toast(r.error.code==='23505'?'Ya tienes una licitación con ese número':'No se pudo guardar. Intenta de nuevo.');return}
          aplicar();
        });
      }else aplicar();
      return;
    }
    if(CLOUD){
      sb.from('licitaciones').insert(toRow(nueva)).select().single().then(function(r){
        if(r.error){toast(r.error.code==='23505'?'Ya tienes una licitación con ese número':'No se pudo guardar. Intenta de nuevo.');return}
        items.push(fromRow(r.data));render();toast('Licitación agregada');
      });
      return;
    }
    nueva.id='u'+Date.now();nueva.estado='Activa';nueva.creada=ahora;
    items.push(nueva);
    save();render();toast('Licitación agregada');
  });
}
var tt;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2600)}

function sync(){
  var el=document.getElementById('backend');var url=(el.value||'').trim().replace(/\/$/,'');
  cfg.backend=url;save();
  var msg=document.getElementById('syncMsg');
  if(!url){msg.textContent='Escribe primero la dirección de tu servidor.';return}
  msg.textContent='Consultando…';
  fetch(url+'/licitaciones').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(arr){
    var n=0,rows=[];arr.forEach(function(x){
      if(!x.num||!x.apertura||!x.entrega)return;
      if(CLOUD){rows.push({user_id:USER.id,num:x.num,inst:x.inst||'',obj:x.obj||'',tipo:x.tipo||'menor',estado:x.estado||'Activa',apertura:x.apertura,entrega:x.entrega});n++;return}
      var ex=items.filter(function(i){return i.num===x.num})[0];
      if(ex){ex.estado=x.estado||ex.estado;ex.apertura=x.apertura;ex.entrega=x.entrega;ex.tipo=x.tipo||ex.tipo}
      else items.push({id:'x'+x.num,num:x.num,inst:x.inst||'',obj:x.obj||'',estado:x.estado||'Activa',apertura:x.apertura,entrega:x.entrega,tipo:x.tipo||''});
      n++;
    });
    if(CLOUD){
      return sb.from('licitaciones').upsert(rows,{onConflict:'user_id,num'}).then(function(r){if(r.error)throw r.error;return dbLoad()}).then(function(){render();toast(n+' licitaciones sincronizadas')});
    }
    items=items.filter(function(i){return !i.ej||!n});
    save();render();toast(n+' licitaciones sincronizadas');
  }).catch(function(){
    msg.textContent='No se pudo conectar. Desde esta vista previa el navegador bloquea servidores externos; en tu sitio, tu servidor también debe permitir peticiones desde la dirección de la página (CORS).';
  });
}

document.addEventListener('change',function(ev){var t=ev.target;if(t&&t.id==='e_user'){S.euser=t.value;render()}});
document.addEventListener('click',function(ev){
  if(ev.target.classList&&ev.target.classList.contains('ov')){S.kpi=null;renderModal();return}
  var b=ev.target.closest('[data-act]');
  if(!ev.target.closest('.search')){var sr=document.getElementById('sres');if(sr)sr.hidden=true}
  if(!ev.target.closest('#bellPanel')&&!ev.target.closest('#bell')&&S.bell){S.bell=false;renderBell()}
  if(DP&&!ev.target.closest('.dpw'))dpClose();
  if(S.pick&&!ev.target.closest('.pickwrap')){S.pick=false;if(!b)render()}
  if(!b)return;
  var a=b.dataset.act;
  if(a==='dp'){var did=b.dataset.for,kd=b.dataset.kind||'date';if(DP&&DP.id===did){dpClose();return}dpClose();var cv0=document.getElementById(did).value;
    if(kd==='date'){var bd=cv0?parse(cv0):TODAY;DP={id:did,kind:'date',y:bd.getFullYear(),m:bd.getMonth()}}
    else if(kd==='time'){var tp=(cv0||'08:00').split(':'),h24=+tp[0];DP={id:did,kind:'time',h:h24%12||12,mi:+tp[1],ap:h24>=12?'PM':'AM'}}
    else DP={id:did,kind:'tipo'};
    dpDraw();return}
  if(a==='tset'){DP.ap=b.dataset.v;tapply();dpDraw();return}
  if(a==='tdone'){dpClose();return}
  if(a==='tipick'){var tw=document.querySelector('.dpw[data-for="f_tipo"]');document.getElementById('f_tipo').value=b.dataset.v;tw.querySelector('.dpt').textContent=TIPOS[b.dataset.v];tw.querySelector('.dpb').classList.add('has');dpClose();return}
  if(a==='dpnav'){var nd=new Date(DP.y,DP.m+(+b.dataset.n),1);DP.y=nd.getFullYear();DP.m=nd.getMonth();dpDraw();return}
  if(a==='dppick'){var pid=DP.id,w2=document.querySelector('.dpw[data-for="'+pid+'"]');document.getElementById(pid).value=b.dataset.d;w2.querySelector('.dpt').textContent=fmt(b.dataset.d);w2.querySelector('.dpb').classList.add('has');dpClose();return}
  if(a==='pick'){S.pick=!S.pick;S.pyear=S.cur.getFullYear();render();return}
  if(a==='pyear'){S.pyear+=+b.dataset.n;render();return}
  if(a==='pmonth'){S.cur=new Date(S.pyear,+b.dataset.m,1);S.pick=false;render();return}
  if(a==='kpi'){S.kpi=b.dataset.k;renderModal();var xb=document.querySelector('.dlg .x');if(xb)xb.focus();return}
  if(a==='rem'){S.kpi='rem';S.remId=b.dataset.id;S.remT=b.dataset.t;renderModal();var xr=document.querySelector('.dlg .x');if(xr)xr.focus();return}
  if(a==='closekpi'){S.kpi=null;renderModal();return}
  if(a==='bellopen'){S.bell=true;render();window.scrollTo(0,0);return}
  if(a==='afilter'){S.af=b.dataset.f;render();return}
  if(a==='wday'){S.wsel=(S.wsel===b.dataset.d)?null:b.dataset.d;render();return}
  if(a==='hist'){goHist(b.dataset.id);return}
  if(a==='histall'){S.histId=null;render();window.scrollTo(0,0);return}
  if(a==='edit'){S.edit=b.dataset.id;S.kpi=null;S.view='licitaciones';S.q='';document.getElementById('q').value='';render();var fc=document.getElementById('formcard');if(fc)fc.scrollIntoView({block:'start'});return}
  if(a==='canceledit'){S.edit=null;render();return}
  if(a==='gocal'){var gd=parse(b.dataset.d);S.kpi=null;S.view='inicio';S.sel=b.dataset.d;S.cur=new Date(gd.getFullYear(),gd.getMonth(),1);render();var mm=document.querySelector('.month');if(mm)mm.scrollIntoView({block:'center'});return}
  if(a==='nav'){S.view=b.dataset.v;S.bell=false;S.q='';S.histId=null;S.edit=null;document.getElementById('q').value='';render();window.scrollTo(0,0)}
  else if(a==='day'){S.sel=b.dataset.d;var d=parse(S.sel);S.cur=new Date(d.getFullYear(),d.getMonth(),1);render()}
  else if(a==='prev'){S.cur=new Date(S.cur.getFullYear(),S.cur.getMonth()-1,1);render()}
  else if(a==='next'){S.cur=new Date(S.cur.getFullYear(),S.cur.getMonth()+1,1);render()}
  else if(a==='today'){S.cur=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);S.sel=iso(TODAY);render()}
  else if(a==='done'){
    var idd=b.dataset.id,ent=new Date().toISOString(),marcar=function(){items.forEach(function(i){if(i.id===idd){i.estado='Entregada';i.entregadaEn=ent}});save();render();toast('Marcada como entregada')};
    if(CLOUD)sb.from('licitaciones').update({estado:'Entregada',entregada_en:ent}).eq('id',idd).then(function(r){if(r.error){toast('No se pudo guardar. Intenta de nuevo.');return}marcar()});
    else marcar();
  }
  else if(a==='del'){
    var idq=b.dataset.id,quitar=function(){items=items.filter(function(i){return i.id!==idq});save();render()};
    if(CLOUD)sb.from('licitaciones').delete().eq('id',idq).then(function(r){if(r.error){toast('No se pudo quitar. Intenta de nuevo.');return}quitar()});
    else quitar();
  }
  else if(a==='logout'){sb.auth.signOut().then(function(){USER=null;items=[];ROL='usuario';LM='in';showLogin()})}
  else if(a==='testmail'){b.disabled=true;sb.functions.invoke('send-alerts',{body:{test:true}}).then(function(r){b.disabled=false;toast(r.error?'No se pudo enviar la prueba. Revisa la configuración del correo.':'Listo. Revisa tu bandeja de entrada y el correo no deseado.')})}
  else if(a==='dismiss'){S.dismissed=true;render()}
  else if(a==='etab'){S.etab=b.dataset.v;S.cm=null;render()}
  else if(a==='gohist'){goHist(b.dataset.id)}
  else if(a==='cmopen'){S.cm=b.dataset.id;render();var cmt=document.getElementById('cm_txt');if(cmt)cmt.scrollIntoView({block:'center'})}
  else if(a==='cmclose'){S.cm=null;render()}
  else if(a==='prio'){
    var pid=b.dataset.id,on=JD.prios.some(function(x){return x.licitacion_id===pid});
    var q=on?sb.from('prioridades').delete().eq('licitacion_id',pid):sb.from('prioridades').insert({licitacion_id:pid});
    q.then(function(r){if(r.error){toast('No se pudo cambiar la prioridad');return}
      if(on)JD.prios=JD.prios.filter(function(x){return x.licitacion_id!==pid});else JD.prios.push({licitacion_id:pid});render()})}
  else if(a==='cmsend'){
    var tx=document.getElementById('cm_txt').value.trim();if(!tx){toast('Escribe el comentario');return}
    sb.from('comentarios').insert({licitacion_id:b.dataset.id,texto:tx}).select().then(function(r){
      if(r.error){toast('No se pudo enviar el comentario');return}
      JD.coms=(r.data||[]).concat(JD.coms);toast('Comentario enviado');render()})}
  else if(a==='cmread'){
    var cid=b.dataset.id;sb.rpc('marcar_leido',{cid:cid}).then(function(r){
      if(r.error){toast('No se pudo marcar');return}
      JD.coms.forEach(function(c){if(c.id===cid)c.leido=true});render()})}
  else if(a==='rolsave'){
    var uid=b.dataset.id,nr=document.getElementById('rol_'+uid).value;
    sb.from('perfiles').update({rol:nr}).eq('user_id',uid).then(function(r){
      if(r.error){toast('No se pudo cambiar el rol');return}
      JD.perfiles.forEach(function(p){if(p.user_id===uid)p.rol=nr});toast('Rol actualizado');render()})}
  else if(a==='sync'){sync()}
  else if(a==='reset'){items=sample();save();render();toast('Ejemplos restaurados')}
});
document.addEventListener('change',function(ev){
  var c=ev.target.closest('[data-th]');if(!c)return;
  var n=+c.dataset.th,i=cfg.th.indexOf(n);
  if(c.checked&&i<0)cfg.th.push(n);if(!c.checked&&i>-1)cfg.th.splice(i,1);
  save();render();
});
document.getElementById('q').addEventListener('input',function(e){
  S.q=e.target.value;
  if(S.view==='licitaciones'){render();document.getElementById('q').focus()}else renderSearch();
});
document.getElementById('q').addEventListener('focus',function(){renderSearch()});
document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&S.view!=='licitaciones'&&S.q){e.preventDefault();var r=searchRes(S.q);if(r.length)goHist(r[0].id)}
  if(e.key==='Escape'){document.getElementById('sres').hidden=true}
});
document.addEventListener('input',function(ev){
  var t=ev.target;if(!DP||DP.kind!=='time'||(t.id!=='t_h'&&t.id!=='t_m'))return;
  var v=parseInt(t.value,10);
  if(t.id==='t_h'&&v>=1&&v<=12)DP.h=v;else if(t.id==='t_m'&&v>=0&&v<=59)DP.mi=v;else return;
  tapply();
});
document.addEventListener('keydown',function(ev){
  var wd=ev.target;
  if((ev.key==='Enter'||ev.key===' ')&&wd.classList&&wd.classList.contains('wd')){ev.preventDefault();wd.click()}
});
document.addEventListener('keydown',function(ev){
  var t=ev.target;
  if(ev.key==='Enter'&&DP&&DP.kind==='time'&&(t.id==='t_h'||t.id==='t_m')){ev.preventDefault();dpClose()}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){if(DP)dpClose();else if(S.kpi){S.kpi=null;renderModal()}}});
render();
if(CLOUD){
  document.querySelector('.app').hidden=true;
  if(!sb){showLogin('No se pudo cargar el servicio de inicio de sesión. Revisa tu conexión y recarga la página.')}
  else{
    sb.auth.onAuthStateChange(function(ev,session){
      if(ev==='PASSWORD_RECOVERY'){RECOV=true;USER=null;LM='reset';showLogin();return}
      if(RECOV&&(ev==='SIGNED_IN'||ev==='INITIAL_SESSION')){showLogin();return}
      if(ev==='SIGNED_IN'&&USER&&session&&session.user.id===USER.id)return;
      if(ev!=='INITIAL_SESSION'&&ev!=='SIGNED_IN'&&ev!=='SIGNED_OUT')return;
      setTimeout(function(){enterApp(session)},0);
    });
  }
}
setInterval(function(){renderBell()},60000);
})();
</script>
